<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazna Style Video Gallery</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome for play icon -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <!-- Magnific Popup CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/magnific-popup.min.css">
  
  <!-- jQuery + Magnific Popup JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/jquery.magnific-popup.min.js"></script>
</head>
<body class="bg-gray-100">

<section class="px-6 md:px-12 2xl:px-[10vw] lg:px-[6vw] w-full relative mb-[50px] sm:mb-[60px] lg:mb-[100px]">
  <h2 class="text-[#00605C] text-[20px] lg:text-[32px] uppercase mb-6">Video Gallery</h2>

  <div id="videoGallery" class="grid grid-cols-1 lg:grid-cols-3 gap-4">

    <!-- Example Video Item -->
    <div class="video-item relative cursor-pointer overflow-hidden rounded-lg shadow-lg">
      <img src="https://img.youtube.com/vi/owZ6KL7R4A4/hqdefault.jpg" 
           class="w-full h-[276px] lg:h-[458px] object-cover">
      <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50">
        <i class="text-white text-4xl fas fa-play"></i>
      </div>
      <a class="popup-youtube absolute inset-0" 
         href="https://www.youtube.com/watch?v=owZ6KL7R4A4?autoplay=1&mute=1"></a>
    </div>

    <!-- More video items -->
    <!-- …repeat similarly… -->

  </div>
</section>


<script>
  $(document).ready(function() {
    $('.popup-youtube').magnificPopup({
      type: 'iframe',
      mainClass: 'mfp-fade',
      preloader: true,
      removalDelay: 300,
      fixedContentPos: false
    });
  });
</script>


</body>
</html>
