<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazna Style Video Gallery</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome for play icon -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <!-- Magnific Popup CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/magnific-popup.min.css">
  
  <!-- jQuery + Magnific Popup JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/jquery.magnific-popup.min.js"></script>
</head>
<body>


<section class="px-4 md:px-12 2xl:px-[10vw] lg:px-[4vw] py-6 md:py-10 bg-white relative overflow-hidden">
  <div class="w-full relative">

    <!-- TITLE -->
    <h2 class="text-center text-3xl md:text-4xl font-semibold text-[#005A57] mb-4">OUR PRODUCTS</h2>
    <p class="text-center text-gray-600 max-w-3xl mx-auto mb-16">
      PHP Arabian Horse Super Dhew Tin is a premium-quality roofing sheet made with the perfect zinc
      coating for maximum durability and rust resistance...
    </p>

    <div class="relative w-full ">

      <svg viewBox="0 0 1200 500" class="w-full mx-auto">

      <path d="M150 480 A 300 500 0 0 1 240 200"
            class="stroke-gray-300 stroke-[12] fill-none" />

      <path d="M263 163 A 370 280 0 0 1 930 165"
            class="stroke-gray-300 stroke-[12] fill-none" />


      <path d="M1050 480 A 300 500 0 0 0 960 200"
      class="stroke-gray-300 stroke-[12] fill-none" />

    </svg>

    <img src="assets/img/tin.png" class="absolute left-1/2 bottom-0 w-[420px] -translate-x-1/2 select-none pointer-events-none">


        <!-- STEP 1 -->
        <div class="">
            <div class="absolute left-[0px] top-[360px] flex items-center gap-3">
              <div class="px-4 py-2 bg-teal-500 text-white rounded-md text-sm font-medium shadow">NOF TIN</div>
            </div>
            <div class="absolute left-28 top-[420px] flex items-center gap-3">
              <div class="w-7 h-7 rounded-full bg-teal-500 text-white flex items-center justify-center text-xs font-bold shadow">1</div>
            </div>
        </div>
        
        <!-- STEP 2 -->
          <div>
              <div class="absolute left-[80px] top-[80px] flex items-center gap-3">
                <div class="px-4 py-2 bg-gray-200 text-gray-600 rounded-md text-sm font-medium shadow uppercase">color tin</div>
              </div>
              <div class="absolute left-[200px] top-[140px] flex items-center gap-3">
                <div class="w-7 h-7 rounded-full bg-teal-500 text-white flex items-center justify-center text-xs font-bold shadow">2</div>
              </div>
          </div>
        

        <!-- STEP 3 -->
        <div>
          <div class="absolute right-[50px] top-[80px] flex items-center gap-3">
            <div class="px-4 py-2 bg-gray-200 text-gray-600 rounded-md text-sm font-medium shadow uppercase">aluminium tin</div>
          </div>
          <div class="absolute right-[204px] top-[141px] flex items-center gap-3">
            <div class="w-7 h-7 rounded-full bg-teal-500 text-white flex items-center justify-center text-xs font-bold shadow">3</div>
          </div>
        </div>

      

        <!-- STEP 4 -->
      <div>
        <div class="absolute right-[110px] top-[420px] flex items-center gap-3">
          <div class="w-7 h-7 rounded-full bg-teal-500 text-gray-600 flex items-center justify-center text-xs font-bold shadow">4</div>
        </div>
        <div class="absolute right-[-50px] top-[360px] flex items-center gap-3">
          <div class="px-4 py-2 bg-gray-200 text-gray-600 rounded-md text-sm font-medium shadow uppercase">PROFILE SHEET</div>
        </div>

      </div>

    </div>
    
  </div>
</section>

<div class="relative w-full aspect-[12/5]">

  <!-- SVG -->
  <svg viewBox="0 0 1200 500" class="absolute inset-0 w-full h-full">
    <path d="M150 480 A 300 500 0 0 1 240 200"
          class="stroke-gray-300 stroke-[12] fill-none" />
    <path d="M263 163 A 370 280 0 0 1 930 165"
          class="stroke-gray-300 stroke-[12] fill-none" />
    <path d="M1050 480 A 300 500 0 0 0 960 200"
          class="stroke-gray-300 stroke-[12] fill-none" />
  </svg>

  <!-- Center Image -->
  <img src="assets/img/tin.png"
       class="absolute left-1/2 bottom-0 w-[420px] -translate-x-1/2 pointer-events-none" />

  <!-- STEP 1 -->
  <div class="absolute left-[0%] top-[72%]">
    <div class="px-4 py-2 bg-teal-500 text-white rounded text-sm">NOF TIN</div>
  </div>
  <div class="absolute left-[12%] top-[84%]">
    <div class="w-7 h-7 bg-teal-500 text-white rounded-full flex items-center justify-center text-xs">1</div>
  </div>

  <!-- STEP 2 -->
  <div class="absolute left-[8%] top-[16%]">
    <div class="px-4 py-2 bg-gray-200 rounded text-sm uppercase">COLOR TIN</div>
  </div>
  <div class="absolute left-[18%] top-[28%]">
    <div class="w-7 h-7 bg-teal-500 text-white rounded-full flex items-center justify-center text-xs">2</div>
  </div>

  <!-- STEP 3 -->
  <div class="absolute right-[8%] top-[16%]">
    <div class="px-4 py-2 bg-gray-200 rounded text-sm uppercase">ALUMINIUM TIN</div>
  </div>
  <div class="absolute right-[18%] top-[28%]">
    <div class="w-7 h-7 bg-teal-500 text-white rounded-full flex items-center justify-center text-xs">3</div>
  </div>

  <!-- STEP 4 -->
  <div class="absolute right-[12%] top-[84%]">
    <div class="w-7 h-7 bg-teal-500 text-white rounded-full flex items-center justify-center text-xs">4</div>
  </div>
  <div class="absolute right-[0%] top-[72%]">
    <div class="px-4 py-2 bg-gray-200 rounded text-sm uppercase">PROFILE SHEET</div>
  </div>

</div>

</body>
</html>
