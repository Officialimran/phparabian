<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Responsive Products Section</title>

  <style>
    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeInUp .8s ease-out forwards; }
  </style>
</head>
<body class="bg-white">

<section class="relative w-full flex justify-center py-16 md:py-20">

  <!-- ARC SECTION (Desktop / Tablet only) -->
  <div class="hidden md:block absolute top-10 left-1/2 -translate-x-1/2 
              w-[90%] max-w-[850px] h-[45vw] max-h-[420px]">

    <!-- GREY ARC -->
    <div class="absolute inset-0 border-t-[5px] md:border-t-[6px] 
                border-gray-300 rounded-t-full"></div>

    <!-- TEAL ARC -->
    <div class="absolute inset-0 border-t-[5px] md:border-t-[6px] 
                border-teal-400 rounded-t-full"
         style="clip-path: inset(0 55% 0 0);">
    </div>
  </div>

  <!-- MOBILE LAYOUT (vertical) -->
  <div class="md:hidden w-full px-6 space-y-6">
    
    <div class="flex items-center gap-3">
      <div class="bg-teal-500 text-white px-4 py-1.5 rounded font-semibold">NOF TIN</div>
      <div class="w-7 h-7 bg-teal-500 text-white rounded-full flex items-center justify-center">1</div>
    </div>

    <div class="flex items-center gap-3">
      <div class="w-7 h-7 bg-gray-300 text-gray-700 rounded-full flex items-center justify-center">2</div>
      <div class="bg-gray-200 text-gray-700 px-4 py-1.5 rounded">COLOR TIN</div>
    </div>

    <div class="flex items-center gap-3">
      <div class="w-7 h-7 bg-gray-300 text-gray-700 rounded-full flex items-center justify-center">3</div>
      <div class="bg-gray-200 text-gray-700 px-4 py-1.5 rounded">ALUMINIUM TIN</div>
    </div>

    <div class="flex items-center gap-3">
      <div class="w-7 h-7 bg-gray-300 text-gray-700 rounded-full flex items-center justify-center">4</div>
      <div class="bg-gray-200 text-gray-700 px-4 py-1.5 rounded">PROFILE SHEET</div>
    </div>
  </div>


  <!-- DESKTOP STEP POSITIONS (absolute) -->
  <!-- STEP 1 -->
  <div class="hidden md:flex absolute left-[10%] lg:left-[13%] 
              top-[62%] xl:top-[63%] items-center gap-3">
    <div class="bg-teal-500 text-white px-5 py-2 rounded font-semibold">NOF TIN</div>
    <div class="w-8 h-8 bg-teal-500 text-white rounded-full flex items-center justify-center">1</div>
  </div>

  <!-- STEP 2 -->
  <div class="hidden md:flex absolute left-[26%] lg:left-[30%] 
              top-[32%] items-center gap-3">
    <div class="w-8 h-8 bg-gray-300 text-gray-700 rounded-full flex items-center justify-center">2</div>
    <div class="bg-gray-200 text-gray-600 px-5 py-2 rounded">COLOR TIN</div>
  </div>

  <!-- STEP 3 -->
  <div class="hidden md:flex absolute right-[26%] lg:right-[30%] 
              top-[32%] items-center gap-3">
    <div class="bg-gray-200 text-gray-600 px-5 py-2 rounded">ALUMINIUM TIN</div>
    <div class="w-8 h-8 bg-gray-300 text-gray-700 rounded-full flex items-center justify-center">3</div>
  </div>

  <!-- STEP 4 -->
  <div class="hidden md:flex absolute right-[10%] lg:right-[12%] 
              top-[62%] xl:top-[63%] items-center gap-3">
    <div class="w-8 h-8 bg-gray-300 text-gray-700 rounded-full flex items-center justify-center">4</div>
    <div class="bg-gray-200 text-gray-600 px-5 py-2 rounded">PROFILE SHEET</div>
  </div>


  <!-- CENTER IMAGE -->
  <div class="relative z-10 mt-20 md:mt-40 flex justify-center">
    <img src="assets/img/tin.png"
         class="w-[70%] max-w-[500px] md:w-[45%] lg:w-[420px] pointer-events-none select-none" />
  </div>

</section>

</body>
</html>
