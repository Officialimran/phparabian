<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bazna Style Video Gallery</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome for play icon -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

  <!-- Magnific Popup CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/magnific-popup.min.css">
  
  <!-- jQuery + Magnific Popup JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/jquery.magnific-popup.min.js"></script>
</head>
<body class="bg-gray-100">

<section class="px-6 md:px-12 2xl:px-[10vw] lg:px-[6vw] w-full relative mb-[50px] sm:mb-[60px] lg:mb-[100px]">

  <h2 class="text-[#00605C] text-[20px] lg:text-[32px] font-normal font-objectsans leading-[36px] lg:leading-[58px] uppercase mb-6 lg:tracking-normal tracking-[0.02em]">
    Video Gallery
  </h2>

  <div id="videoGallery" class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <!-- Video template will be cloned here -->
  </div>

  <div class="text-center mt-10">
    <button id="loadMore" class="text-[14px] leading-[100%] font-poppins font-semibold px-[21px] py-[14px] border border-[#00605C] text-[#00605C] rounded-full hover:bg-[#00605C] hover:text-[#fff] transition">
      Load More
    </button>
  </div>
</section>

<script>
  const videoData = [
    {title: "PHP Weekly Summit", date: "26th, September, 2025", thumb: "https://img.youtube.com/vi/owZ6KL7R4A4/hqdefault.jpg", url: "https://www.youtube.com/watch?v=owZ6KL7R4A4"},
    {title: "Laravel Tips", date: "12th, October, 2025", thumb: "https://img.youtube.com/vi/owZ6KL7R4A4/hqdefault.jpg", url: "https://www.youtube.com/watch?v=owZ6KL7R4A4"},
    {title: "JavaScript Tricks", date: "5th, November, 2025", thumb: "https://img.youtube.com/vi/owZ6KL7R4A4/hqdefault.jpg", url: "https://www.youtube.com/watch?v=owZ6KL7R4A4"},
    {title: "Vue.js Mastery", date: "18th, December, 2025", thumb: "https://img.youtube.com/vi/owZ6KL7R4A4/hqdefault.jpg", url: "https://www.youtube.com/watch?v=owZ6KL7R4A4"},
    {title: "React Components", date: "20th, December, 2025", thumb: "https://img.youtube.com/vi/owZ6KL7R4A4/hqdefault.jpg", url: "https://www.youtube.com/watch?v=owZ6KL7R4A4"},
    {title: "Tailwind CSS Deep Dive", date: "22nd, December, 2025", thumb: "https://img.youtube.com/vi/owZ6KL7R4A4/hqdefault.jpg", url: "https://www.youtube.com/watch?v=owZ6KL7R4A4"},
  ];

  let loadedCount = 0;
  const loadStep = 3;
  const gallery = document.getElementById('videoGallery');
  const loadMoreBtn = document.getElementById('loadMore');

  function loadVideos() {
    const nextVideos = videoData.slice(loadedCount, loadedCount + loadStep);

    nextVideos.forEach(video => {
      const videoItem = document.createElement('div');
      videoItem.className = 'video-item relative cursor-pointer overflow-hidden rounded-lg shadow-lg';
      
      videoItem.innerHTML = `
        <img src="${video.thumb}" alt="${video.title}" class="w-full h-[276px] lg:h-[458px] object-cover">
        <div class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50">
          <i class="fas fa-play text-white text-4xl"></i>
        </div>
        <div class="absolute bottom-0 left-0 w-full bg-[#00605C] p-4 text-white">
          <h3 class="font-semibold text-lg">${video.title}</h3>
          <p class="text-sm">${video.date}</p>
        </div>
        <a class="popup-youtube absolute inset-0" href="${video.url}"></a>
      `;
      gallery.appendChild(videoItem);
    });

    loadedCount += nextVideos.length;
    if (loadedCount >= videoData.length) loadMoreBtn.style.display = 'none';

    // Initialize Magnific Popup on newly added items with autoplay
    $('.popup-youtube').magnificPopup({
      type: 'iframe',
      mainClass: 'mfp-fade',
      preloader: true,
      removalDelay: 300,
      fixedContentPos: false,
      iframe: {
        patterns: {
          youtube: {
            index: 'youtube.com/',
            id: 'v=',
            src: 'https://www.youtube.com/embed/%id%?autoplay=1&mute=1'
          }
        }
      }
    });
  }

  // Initial load
  loadVideos();
  loadMoreBtn.addEventListener('click', loadVideos);
</script>

</body>
</html>
