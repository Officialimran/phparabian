<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Step Carousel</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Swiper CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"
  />

  <style>
    .swiper-slide img {
      width: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body class="bg-white">

<div class="max-w-5xl mx-auto px-4 py-6">

  <!-- ITEMS NAMES CAROUSEL -->
  <div class="relative mb-6">

    <!-- LINE INDICATOR -->
    <div class="absolute top-2/3 left-2 right-2 h-[2px] bg-gray-300 -z-10"></div>

    <!-- ITEMS SWIPER -->
    <div class="swiper mySwiperItems">
      <div class="swiper-wrapper">

        <!-- STEP 1 -->
        <div class="swiper-slide text-center cursor-pointer flex flex-col space-y-1">
          <div class="step-number text-[20px] text-[#9EA4AD] font-normal font-objectsans">1</div>
          <div class="step-content text-[#FFFFFF] text-[14px] font-bold font-objectsans items-center py-4 rounded-lg">
            NOF TIN
          </div>
        </div>

        <!-- STEP 2 -->
        <div class="swiper-slide text-center cursor-pointer flex flex-col space-y-1">
          <div class="step-number text-[20px] text-[#9EA4AD] font-normal font-objectsans">2</div>
          <div class="step-content text-[#FFFFFF] text-[14px] font-bold font-objectsans items-center py-4 rounded-lg">
            COLOR TIN
          </div>
        </div>

        <!-- STEP 3 -->
        <div class="swiper-slide text-center cursor-pointer flex flex-col space-y-1">
          <div class="step-number text-[20px] text-[#9EA4AD] font-normal font-objectsans">3</div>
          <div class="step-content text-[#FFFFFF] text-[14px] font-bold font-objectsans items-center py-4 rounded-lg">
            ALUMINIUM TIN
          </div>
        </div>

        <!-- STEP 4 -->
        <div class="swiper-slide text-center cursor-pointer flex flex-col space-y-1">
          <div class="step-number text-[20px] text-[#9EA4AD] font-normal font-objectsans">4</div>
          <div class="step-content text-[#FFFFFF] text-[14px] font-bold font-objectsans items-center py-4 rounded-lg">
            PROFILE SHEET
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- IMAGE CAROUSEL -->
  <div class="swiper mySwiperImages">
    <div class="swiper-wrapper">

      <div class="swiper-slide flex justify-center">
        <img src="assets/img/tin.png" alt="NOF TIN" class="w-64">
      </div>

      <div class="swiper-slide flex justify-center">
        <img src="assets/img/tin.png" alt="COLOR TIN" class="w-64">
      </div>

      <div class="swiper-slide flex justify-center">
        <img src="assets/img/tin.png" alt="ALUMINIUM TIN" class="w-64">
      </div>

      <div class="swiper-slide flex justify-center">
        <img src="assets/img/tin.png" alt="PROFILE SHEET" class="w-64">
      </div>

    </div>
  </div>

</div>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

<script>
  // ITEMS SWIPER
  const swiperItems = new Swiper(".mySwiperItems", {
    slidesPerView: 2.5,
    spaceBetween: 8,
    loop: false,
    breakpoints: {
      640: { slidesPerView: 2.5 },
      768: { slidesPerView: 3 },
      1024: { slidesPerView: 4 },
    },
  });

  // IMAGE SWIPER
  const swiperImages = new Swiper(".mySwiperImages", {
    slidesPerView: 1,
    spaceBetween: 16,
    loop: true,
    autoplay: {
      delay: 2500,
      disableOnInteraction: false,
    },
    on: {
      slideChange: function () {
        swiperItems.slideTo(this.realIndex);
        updateActiveStep(this.realIndex);
      },
    },
  });

  function updateActiveStep(index) {
    swiperItems.slides.forEach((slide, i) => {
      const number = slide.querySelector(".step-number");
      const content = slide.querySelector(".step-content");

      if (i === index) {
        // ACTIVE
        number.classList.add("text-[#57C4BD]");
        number.classList.remove("text-[#9EA4AD]");

        content.classList.add("bg-[#57C4BD]", "text-white");
        content.classList.remove("bg-[#D9D9D9]");
      } else {
        // INACTIVE
        number.classList.add("text-[#9EA4AD]");
        number.classList.remove("text-[#57C4BD]");

        content.classList.add("bg-[#D9D9D9]", "text-white");
        content.classList.remove("bg-[#57C4BD]");
      }
    });
  }

  // CLICK STEP → CHANGE IMAGE
  swiperItems.slides.forEach((slide, index) => {
    slide.addEventListener("click", () => {
      swiperImages.slideToLoop(index);
    });
  });

  

  // INIT
  updateActiveStep(0);
</script>

</body>
</html>
