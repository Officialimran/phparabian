<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white flex items-center justify-center py-20">

  <div class="relative w-full max-w-5xl mx-auto">

    <!-- ARC SVG (4 colored segments + gaps) -->
    <svg viewBox="0 0 1200 500" class="w-full mx-auto">

      <!-- GAP SIZE (X-axis shift) -->
      <!-- Instead of perfect 150→375, we create 6px gap on each side -->
      
      <!-- Arc 1 -->
      <path d="M150 480 A 300 300 0 0 1 369 480"
            class="stroke-teal-500 stroke-[6] fill-transparent" />

      <!-- Arc 2 -->
      <path d="M381 480 A 300 300 0 0 1 594 480"
            class="stroke-blue-500 stroke-[6] fill-transparent" />

      <!-- Arc 3 -->
      <path d="M606 480 A 300 300 0 0 1 819 480"
            class="stroke-orange-500 stroke-[6] fill-transparent" />

      <!-- Arc 4 -->
      <path d="M831 480 A 300 300 0 0 1 1050 480"
            class="stroke-rose-500 stroke-[6] fill-transparent" />

    </svg>


   

    <!-- STEP 1 -->
    <div>
      <div class="absolute left-2 top-[360px] flex items-center gap-3">
        <div class="px-4 py-2 bg-teal-500 text-white rounded-md text-sm font-medium shadow">NOF TIN</div>
      </div>
      <div class="absolute left-28 top-[420px] flex items-center gap-3">
        <div class="w-7 h-7 rounded-full bg-teal-500 text-white flex items-center justify-center text-xs font-bold shadow">1</div>
      </div>
    </div>


    <!-- STEP 2 -->
    <div>
      <div class="absolute left-10 top-[120px] flex items-center gap-3">
        <div class="px-4 py-2 bg-gray-200 text-gray-600 rounded-md text-sm font-medium shadow uppercase">color tin</div>
      </div>
      <div class="absolute left-44 top-[180px] flex items-center gap-3">
        <div class="w-7 h-7 rounded-full bg-teal-500 text-white flex items-center justify-center text-xs font-bold shadow">2</div>
      </div>
    </div>


    <!-- STEP 3 -->
    <div>
      <div class="absolute right-4 top-[120px] flex items-center gap-3">
        <div class="px-4 py-2 bg-gray-200 text-gray-600 rounded-md text-sm font-medium shadow uppercase">aluminium tin</div>
      </div>
      <div class="absolute right-44 top-[180px] flex items-center gap-3">
        <div class="w-7 h-7 rounded-full bg-teal-500 text-white flex items-center justify-center text-xs font-bold shadow">3</div>
      </div>
    </div>


    <!-- STEP 4 -->
    <div>
      <div class="absolute right-[120px] top-[420px] flex items-center gap-3">
        <div class="w-7 h-7 rounded-full bg-teal-500 text-gray-600 flex items-center justify-center text-xs font-bold shadow">4</div>
      </div>
      <div class="absolute right-[-25px] top-[360px] flex items-center gap-3">
        <div class="px-4 py-2 bg-gray-200 text-gray-600 rounded-md text-sm font-medium shadow uppercase">PROFILE SHEET</div>
      </div>
    </div>

  </div>

</body>
</html>
