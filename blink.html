<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossfade Images</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .crossfade-container {
      position: relative;
      width: 160px; /* same as w-40 */
      height: 160px; /* same as h-40 */
    }
    .crossfade-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      animation: crossfade 4s infinite;
    }
    .crossfade-container img:nth-child(1) {
      animation-delay: 0s;
    }
    .crossfade-container img:nth-child(2) {
      animation-delay: 2s; /* half of total duration for smooth crossfade */
    }

    @keyframes crossfade {
      0% { opacity: 0; }
      25% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="crossfade-container">
    <img src="assets/img/25-logo.png" alt="Logo 1">
    <img src="assets/img/logo.png" alt="Logo 2">
  </div>
</body>
</html>
