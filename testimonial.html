<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swiper Testimonial</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Swiper -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>


</head>

<body class="bg-white">

<section class="py-20">
  <div class="max-w-7xl mx-auto px-4">   

    <div class="w-[420px] h-[120px] bg-red-600 clip-arrow"></div>

<style>
  .clip-arrow {
    clip-path: polygon(
      0% 0%,
      85% 0%,
      100% 50%,
      85% 100%,
      0% 100%
    );
  }
</style>


<div class="relative h-[120px] w-[360px] bg-red-600 mt-10">
  <div class="absolute top-0 right-[-60px] 
              w-0 h-0
              border-t-[60px] border-b-[60px]
              border-l-[60px]
              border-t-transparent border-b-transparent
              border-l-red-600">
  </div>
</div>


<section class="relative w-[500px] h-[500px] mx-auto my-20">

  <!-- CIRCLE BORDER -->
  <div class="absolute inset-0 rounded-full border-[6px] border-gray-300"></div>

  <!-- STEP 1 -->
  <div class="absolute left-[-40px] top-1/2 -translate-y-1/2
              clip-arrow bg-teal-400 text-white px-6 py-2">
    NOF TIN
  </div>

  <!-- STEP 2 -->
  <div class="absolute top-[-20px] left-1/2 -translate-x-1/2
              clip-arrow bg-gray-200 text-gray-500 px-6 py-2 rotate-90">
    COLOR TIN
  </div>

  <!-- STEP 3 -->
  <div class="absolute right-[-40px] top-1/2 -translate-y-1/2
              clip-arrow bg-gray-200 text-gray-500 px-6 py-2 rotate-180">
    ALUMINIUM TIN
  </div>

  <!-- STEP 4 -->
  <div class="absolute bottom-[-20px] left-1/2 -translate-x-1/2
              clip-arrow bg-gray-200 text-gray-500 px-6 py-2 -rotate-90">
    PROFILE SHEET
  </div>

</section>


<svg
  class="absolute inset-0 w-full h-full"
  viewBox="0 0 500 500"
>
  <path
    d="M 60 250 A 190 190 0 0 1 440 250"
    fill="none"
    stroke="#D1D5DB"
    stroke-width="6"
  />
</svg>


    
  </div>
</section>

<style>
  .shape {
  clip-path: polygon(
    0% 0%,
    75% 0%,
    90% 50%,
    75% 100%,
    0% 100%
  );
}

/* connection line */
.connector-line {
  position: absolute;
  top: 50%;
  right: -10px;
  width: 180px;
  height: 4px;
  background: #dc2626; /* red-600 */
  transform-origin: left center;
  transform: rotate(35deg);
}

</style>

<div class="relative w-[520px] h-[160px]">
  <!-- Shape -->
  <div class="shape bg-red-600 w-full h-full"></div>

  <!-- Diagonal Line -->
  <div class="connector-line"></div>
</div>


</body>
</html>
